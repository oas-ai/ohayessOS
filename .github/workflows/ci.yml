name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  license:
    uses: oas-ai/.github/.github/workflows/license-check.yml@main
  rust:
    uses: oas-ai/.github/.github/workflows/rust-ci.yml@main
  hmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oas-ai/sdk
          ref: 0e013d24a08dea09a5be607285bf5b3eaf946d27
          path: sdk
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler qt6-base-dev qt6-declarative-dev
      - run: cmake -S apps/hmi -B build/hmi -DOAS_SDK_PROTO_DIR="$GITHUB_WORKSPACE/sdk/proto"
      - run: cmake --build build/hmi --parallel
      - run: ctest --test-dir build/hmi --output-on-failure
